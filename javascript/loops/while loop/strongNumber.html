    <script>
        function factorial(n) {
            let fact = 1;
            while (n >= 0) {
                fact = fact * n;
                n--;
            }
            return fact;
        }

        let n = 145;
        let sum = 0;
        let temp = n;

        function strong(temp) {
            let rem = temp % 10;
            let fact = factorial(rem);
            sum = sum + fact;

        }

            console.log(`${n} is a strong no.`)
