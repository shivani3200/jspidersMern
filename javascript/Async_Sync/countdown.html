<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Countdown</h1>
    <h2 id="display"></h2>

    <script>
      let count = 10;

      let timerId = setInterval(() => {
        document.getElementById("display").innerHTML += `${count}  <br/>`;
        count--;

        if (count == 0) {
          clearInterval(timerId);
          document.getElementById("display").innerHTML += `happy new year`;
        }
      }, 1000);
    </script>
  </body>
</html>
