 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> form input dynamic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">form</a>
        </div>
    </nav>

    <div class="row mt-4" id="container">
        <div class="col-md-4 m-auto">
            <div class="card">
                <div class="card-header text-center text-white bg-dark">
                    <div>Digital Watch Box</div>
                </div>
                <div class="card-body">
                    <h2 id = "time-ele">Time</h2>
                    <h2 id = "date-ele">Date</h2>
                </div>

            </div>
        </div>
    </div>

    <script>
        function timer(){
            let d1 = new Date();
            let currTime = d1.toLocaleTimeString(); 
            let currDate = d1.toLocaleDateString(); 
 

            document.getElementById('time-ele').textContent = currTime;
            document.getElementById('date-ele').textContent = currDate;

        }

       let id =  setInterval(timer,1000)
        setTimeout(function(){
            clearInterval(id);
        },5000);
    </script>

</body>

</html>
