<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> form input dynamic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a href="#" class="navbar-brand">DOM</a>
    </div>
  </nav>

  <div class="row mt-4" id="container">

    <div class="col-md-4 m-auto">
      <div class="card">
        <div class="card-header text-center text-white bg-dark">
          <div>Input Box</div>
        </div>
        <div class="card-body">
          <!-- form -->
          <form id="login-form">
            <div class="mb-2">
              <input type="text" placeholder="username" class="form-control" id="usn-box">
            </div>
            <div class="mb-4">
              <input type="password" placeholder="password" class="form-control" id="pwd-box">
            </div>
            <input type="submit" class="bg-dark text-white btn btn" />
          </form>
        </div>

      </div>
    </div>
  </div>

  <script>
    let usnElement = document.getElementById('usn-box');
    let pwdElement = document.getElementById('pwd-box');
    let loginFormElement = document.getElementById('login-form');


    loginFormElement.addEventListener('submit', function (e) {

      e.preventDefault();
      let usn = usnElement.value;
      let pwd = pwdElement.value;

      let userInfo = {
        username: usn,
        password: pwd
      }
      console.log(userInfo)
      usnElement.value = "";
      pwdElement.value = "";

    })
  </script>

</body>

</html>
