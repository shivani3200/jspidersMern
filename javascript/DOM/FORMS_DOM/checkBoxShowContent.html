<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> form input dynamic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">form</a>
        </div>
    </nav>

    <div class="row mt-4" id="container">
        <div class="col-md-4 m-auto">
            <div class="card">
                <div class="card-header text-center text-white bg-dark">
                    <div>check Box</div>
                </div>
                <div class="card-body">
                    <!-- form -->
                    <form id="login-form">

                        <div class="input-group mb-3">
                            <input type="password" class="form-control" placeholder="password" id="password-box">
                            <button class="btn btn-outline-secondary" type="button" id="btn1"><i
                                    class="bi bi-eye-fill" id = "btnIcon"></i></button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        let passwordBoxElement = document.getElementById('password-box');
        let loginElement = document.getElementById('login-form')
        let btn1Element = document.getElementById('btn1');
        let btnIconElement = document.getElementById('btnIcon');
        
        let firstClick = true;

        btn1Element.addEventListener('click', function () {

            if (firstClick) {
                btn1();
            }
            else {
                btn2();
            }
            firstClick=!firstClick;
        })


        function btn1(){
                passwordBoxElement.setAttribute('type', 'text')
                btnIconElement.setAttribute('class','bi bi-eye-fill')   
        }
        
        function btn2(){
                passwordBoxElement.setAttribute('type', 'password');
                btnIconElement.setAttribute('class','bi bi-eye-slash')
        }

    </script>

</body>

</html>
