<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> form input dynamic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a href="#" class="navbar-brand">DOM</a>
    </div>
  </nav>

  <div class="row mt-4" id="container">

    <div class="col-md-4 m-auto">
      <div class="card">
        <div class="card-header text-center text-white bg-dark">
          <div>Input Box</div>
        </div>
        <div class="card-body">
          <form>
            <div>
              <input type="text" placeholder="enter" class="form-control" id="usn-box">
            </div>
          </form>
        </div>
        <div class="card-footer text-center text-white bg-primary">
          <h3 id="display-data"></h3>
        </div>
      </div>

    </div>
  </div>



  
    <script>
      let usnElement = document.getElementById('usn-box');
      let displayElement = document.getElementById('display-data')

      let textEntered = usnElement.value;


      //for making it dynamic we have removed value attribute from input and added keyup event

      usnElement.addEventListener('keyup', function(e){
        displayElement.textContent= usnElement.value;
      })
    </script>

</body>
</html>
