<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> form input dynamic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a href="#" class="navbar-brand">form</a>
    </div>
  </nav>

  <div class="row mt-4" id="container">
    <div class="col-md-4 m-auto">
      <div class="card">
        <div class="card-header text-center text-white bg-dark">
          <div>check Box</div>
        </div>
        <div class="card-body">
          <!-- form -->
          <form id="login-form">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="check-box" value="happy">
              <label for="">happy</label>
            </div>
            
          </form>
        </div>

      </div>
    </div>
  </div>

  <script>
    let checkBoxElement = document.getElementById('check-box');
    checkBoxElement.addEventListener('change', function(){

      let temp = checkBoxElement.checked

      if(temp){
        console.log(checkBoxElement.value)
        console.log('checked')
      }
      else{
        console.log('not checked')
      }
    })
  
  </script>

</body>

</html>
