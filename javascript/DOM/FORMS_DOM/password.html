<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> form input dynamic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">form</a>
        </div>
    </nav>

    <div class="row mt-4" id="container">
        <div class="col-md-4 m-auto">
            <div class="card">
                <div class="card-header text-center text-white bg-dark">
                    <div>check Box</div>
                </div>
                <div class="card-body">
                    <!-- form -->
                    <form id="login-form">
                        <div class="input-group mb-3">
                            <div class="input-group-text">
                                <input class="form-check-input mt-0" type="checkbox" value="" id="check-box">
                            </div>
                            <input type="password" class="form-control" id="password-box">
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        let checkBoxElement = document.getElementById('check-box');
        let passwordBoxElement = document.getElementById('password-box');

        checkBoxElement.addEventListener('change', function () {

            let temp = checkBoxElement.checked

            if (temp) {
                passwordBoxElement.setAttribute('type', 'text')
            }
            else {
                passwordBoxElement.setAttribute('type', 'password')
            }
        })

    </script>

</body>

</html>
