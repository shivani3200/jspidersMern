<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Card</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class=" row d-flex justify-content-center align-items-center vh-100 bg-dark">

    <div class=" col-sm-3 border rounded-4 p-3 bg-success-subtle" style="width: 250px;">

        <img src="./purse.jpg"
             class="img-fluid rounded-4 border border-success mb-2"
             style="height: 200px; object-fit: cover;"
             alt="image">

        <div class="bg-light rounded-4 p-2">

            <p class="fw-medium mb-1">Gucci purse</p>

            <div class="mb-2">
                <span class="badge bg-primary-subtle text-dark border">S</span>
                <span class="badge bg-primary-subtle text-dark border">M</span>
                <span class="badge bg-primary-subtle text-dark border">L</span>
                <span class="badge bg-danger text-white">XL</span>
            </div>

            <p class="small mb-2">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </p>

            <div class="mb-2">
                <i class="bi bi-star-fill text-warning"></i>
                <i class="bi bi-star-fill text-warning"></i>
                <i class="bi bi-star-fill text-warning"></i>
                <i class="bi bi-star-half text-warning"></i>
                <i class="bi bi-star text-warning"></i>
                <small class="text-muted">(52 reviews)</small>
            </div>

            <span class="badge bg-danger">Limited time deal</span>

            <div class="mt-2 small">
                <sup>₹</sup>
                <strong>56,000</strong>
                <span class="text-muted">
                    MRP: <del>100,000</del>
                </span>
                <span class="fw-medium">(44% off)</span>
            </div>

            <div class="small my-2">
                FREE delivery <strong>Fri, 26 Dec</strong><br>
                Or fastest delivery <strong>Tomorrow, 25 Dec</strong>
            </div>

            <div class="d-flex gap-1 flex-wrap">
                <button class="btn btn-sm btn-primary">
                    Cart <i class="bi bi-cart3"></i>
                </button>

                <button class="btn btn-sm btn-warning">
                    Buy <i class="bi bi-bag"></i>
                </button>

                <button class="btn btn-sm btn-danger">
                    <i class="bi bi-heart-fill"></i>
                </button>
            </div>

        </div>
    </div>
    

</body>
</html>
