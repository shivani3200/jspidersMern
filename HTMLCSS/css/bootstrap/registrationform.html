<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="" class="navbar-brand">Adventure</a>
        </div>
    </nav>
    <section class="container-fluid mt-3">
        <div class="row">
            <div class="col-5 m-auto ">
                <div class="card">
                    <div class="card-header container-fluid bg-warning text-center">
                        <h4>Registration Form</h4>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-2">
                                <label for="usn" class="form-label">Username</label>
                                <input type="text" name="usn" class="form-control">
                            </div>
                            <div class="mb-2 input-group">
                                <input type="password" name="usn" class="form-control">
                                <span class="input-group-text"><i class="bi bi-eye-slash-fill"></i></span>
                            </div>
                            <div>
                                <label for="dropdown" class="mb-2">select any option</label>
                                <select name="dropdown" id="dropdown" class="form-select mb-4">
                                    <option selected>Open this select menu</option>
                                    <option value="">option 2</option>
                                    <option value="">option 3</option>
                                    <option value="">option 4</option>
                                </select>
                            </div>
                            <div class="form-check form-check-inline mb-2">
                                <input type="checkbox" id="checkbox1" class="form-check-input mb-2 cursor-pointer" checked>
                                <label for="checkbox1" class="form-check-label">Checkbox 1</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input type="checkbox" id="checkbox2" class="form-check-input mb-2 cursor-pointer" disabled>
                                <label for="checkbox2" class="form-check-label">Checkbox 2</label>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                                <label class="form-check-label" for="radioDefault1">
                                    Default radio
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input mb-2" type="radio" name="radioDefault" id="radioDefault2"
                                    checked>
                                <label class="form-check-label mb-2" for="radioDefault2">
                                    Default checked radio
                                </label>
                            </div>
                            <div>
                                <button class="btn btn-primary mb-2" type="submit">Submit form</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
