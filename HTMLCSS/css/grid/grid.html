<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
    *{
        margin: 0px;
        box-sizing: border-box;
    }
    .container{
        height: 500px;
        width: 800px;
        background-color: #5A0E24;
        display: grid;
        grid-template-columns: 100px 100px 100px 100px;
        /* grid-template-columns: repeat(3,auto); */
        grid-template-rows: 100px 100px 100px 100px;
        /* column-gap: 5px;
        row-gap: 2px; */
        gap: 2px;
    }
    .item{ 
        /* height: 100px;
        width: 100px; */
        /* border: 1px solid blue; */
        padding: 20px;
        border-radius: 4px;
        background-color: #fdf3ca;
    }
    /* .item-2{
        grid-column-start: 2;
        grid-column-end: 5;
    } */
     .item-2{
        grid-column: 2/4;
     }
     .item-5{
        grid-row-start: 2;
        grid-row-end: 4;
     }
     .item-7{
        grid-column: 4/5;
        grid-row: 2/4;
     }
     .item-10{
        grid-column: 1/4;
        grid-row: 4/5;
     }
     .item-9{
        grid-column: 2/4;
        grid-row: 3/4;
     }
        </style>
</head>
<body>

    <div class="container">
        <div class="item item-1">div - 1</div>
        <div class="item item-2">div - 2</div>
        <div class="item item-3">div - 3</div>
        <div class="item item-4">div - 4</div>
        <div class="item item-5">div - 5</div>
        <div class="item item-6">div - 6</div>
        <div class="item item-7">div - 7</div>
        <div class="item item-8">div - 8</div>
        <div class="item item-9">div - 9</div>
        <div class="item item-10">div - 10</div>
    </div>
</body>
</html>
