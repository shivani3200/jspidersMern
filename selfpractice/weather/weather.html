<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <link rel="stylesheet" href="weather.css">
  <script src="weather.js" defer></script>
</head>

<body>
  <div class="card">
    <!-- search -->
    <div class="search">
    <input type="text" id="cityInput" placeholder="enter city name" spellcheck="false">
    <button class="searchBtn"><img src="searchicon.png" alt="Search"></button>
    </div>


    <!-- weather -->
     <div class="weather">
      <img src="weathericon.png" alt="Weather Icon" class="weather-icon">
      <h1 class="temp">25°C</h1>
      <h2 class="city">City Name</h2>

        </div>
        <div class="col">
          <img src="windyicon.png" alt="Wind Icon">
          <p class="wind">15 km/h</p>
          <p>wind speed</p>
        </div>

      </div> -->
    
      <div class="details">
        <div class="col">
          <img src="humidityicon.png" alt="Humidity Icon">
          <div class="row">
            <div class="humidity">50%</div>
            <div>humidity</div> 
          </div>
        </div>
        <div class="col">
          <img src="windyicon.png" alt="Wind Icon">
          <div class="row">
            <div class="wind">15 km/h</div>
