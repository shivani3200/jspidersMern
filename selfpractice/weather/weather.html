<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <link rel="stylesheet" href="weather.css">
  <script src="weather.js" defer></script>
</head>

<body>
  <div class="card">
    <!-- search -->
    <div class="search">
    <input type="text" id="cityInput" placeholder="enter city name" spellcheck="false">
    <button class="searchBtn"><img src="../../images/searchicon.png" alt="Search"></button>
    </div>


    <!-- weather -->
     <div class="weather">
  <div class="weather-icon-container">
    <div class="glow-layer"></div>
    <img src="../../images/weathericon.png" alt="Weather Icon" class="weather-icon">
  </div>
  
  <h1 class="temp">25°C</h1>
  <h2 class="city">City Name</h2>
      <div class="details">
        <div class="col">
          <img src="../../images/humidityicon.png" alt="Humidity Icon">
          <div class="row">
            <div class="humidity">50%</div>
            <div>humidity</div> 
          </div>
        </div>
        <div class="col">
          <img src="../../images/windyicon.png" alt="Wind Icon">
          <div class="row">
            <div class="wind">15 km/h</div>
            <div>wind speed</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apiKey = 'e7334a135b825a887907f46571fc9b4f';
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric";

    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");

    async function fetchWeather(city) {
      const response = await fetch(`${apiUrl}&appid=${apiKey}&q=${city}`);
      const data = await response.json();
      console.log(data);
      
      document.querySelector(".city").innerHTML = data.name;
      document.querySelector(".temp").innerHTML = `${Math.round(data.main.temp)}°C`;
      document.querySelector(".humidity").innerHTML = `${data.main.humidity}%`;
      document.querySelector(".wind").innerHTML = `${data.wind.speed} km/h`;

      if (data.weather[0].main === "Clouds") {
        document.querySelector(".weather-icon").src = "../../images/cloudyicon.png";
      } else if (data.weather[0].main === "Clear") {
        document.querySelector(".weather-icon").src = "../../images/sunnyicon.png";
      } else if (data.weather[0].main === "Rain") {
        document.querySelector(".weather-icon").src = "../../images/rainyicon.png";
      } else if (data.weather[0].main === "Snow") {
        document.querySelector(".weather-icon").src = "../../images/snowyicon.png";
      } else {
        document.querySelector(".weather-icon").src = "../../images/weathericon.png";
      }

      document.querySelector(".weather").style.display = "block";
    }

    searchBtn.addEventListener("click", () => {
      fetchWeather(searchBox.value);
    });
    
    searchBox.addEventListener("keypress", (event) => {
      if (event.key === "Enter") {
        fetchWeather(searchBox.value);
      }
    });

  </script>
</body>

</html>
