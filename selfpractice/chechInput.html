<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="row">
      <div class="col-4">
        <div class="card">
          <div class="card-body" id="shiv">
            <form id="form-box">
              <input type="number" class="input-form-control" id="input-box" />
              <input type="submit"/>
            </form>
            <h2 id="display">text</h2>
          </div>
        </div>
      </div>
    </div>

    <script>
      let formElement = document.getElementById("form-box");
      let shivElement = document.getElementById("shiv");
      let inputElement = document.getElementById("input-box");
      let displayElement = document.getElementById("display");

      formElement.addEventListener('submit', function(e) {
        e.preventDefault();
        let x = inputElement.value;
        displayElement.textContent = x;
        if (x % 2 == 0) {
          shivElement.setAttribute("class", "bg-success");
        } else {
          shivElement.setAttribute("class", "bg-danger");
        }

        inputElement.value = "";
      });
    </script>
  </body>
</html>
