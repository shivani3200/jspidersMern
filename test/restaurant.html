<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant</title>
    <style>
      .container {
        background-color: lightcoral;
        display: flex;
        justify-content: center;
        text-align: center;
        padding: 50px;
        margin: 50px;
      }
      .input {
        padding: 10px 10px;
        margin: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <form id="regForm">
          <input
            type="text"
            placeholder="enter name"
            id="name"
            class="input"
          />

          <input
            type="number"
            name="price"
            placeholder="enter price"
            id="price"
            class="input"
          />

          <select name="category" id="category" class="input">
            <option value="">--choose category--</option>
            <option value="Veg">Veg</option>
            <option value="nonVeg">Non Veg</option>
          </select>

          <!-- Checkbox Added -->
          <label class="input">
            <input type="checkbox" id="available" />
            Available
          </label>

          <button type="submit" class="input">Add</button>
        </form>

        <div>
          <div>
            <h1>Veg</h1>
            <ul id="display-veg"></ul>
          </div>

          <div>
            <h1>Non-Veg</h1>
            <ul id="display-nonveg"></ul>
          </div>
        </div>
      </div>
    </div>

    <script>
      let formElement = document.getElementById("regForm");
      let nameElement = document.getElementById("name");
      let priceElement = document.getElementById("price");
      let categoryElement = document.getElementById("category");
      let availableElement = document.getElementById("available");

      let displayveg = document.getElementById("display-veg");
      let displaynonveg = document.getElementById("display-nonveg");

      let renderlist = localStorage.getItem("renderlist")
        ? JSON.parse(localStorage.getItem("renderlist"))
        : [];

      formElement.addEventListener("submit", function (e) {
        e.preventDefault();

        let name = nameElement.value.trim();
        let category = categoryElement.value;
        let price = Number(priceElement.value);
        let available = availableElement.checked;

        if (name.length <= 0 || price <= 0 || category === "") {
          alert("Add name, price & category");
          return;
        }

        let obj = { name, category, price, available };

        if (renderlist.find((item) => item.name === obj.name)) {
          alert("Item already added");
          return;
        }

        renderlist.push(obj);
        localStorage.setItem("renderlist", JSON.stringify(renderlist));

        let li = document.createElement("li");
        li.textContent = `Name: ${name}, Price: ${price}, Available: ${
          available ? "Yes" : "No"
        }`;

        if (category === "Veg") {
          displayveg.appendChild(li);
        } else {
          displaynonveg.appendChild(li);
        }

        // Reset
        nameElement.value = "";
        categoryElement.value = "";
        priceElement.value = "";
        availableElement.checked = false;
      });
    </script>
  </body>
</html>
